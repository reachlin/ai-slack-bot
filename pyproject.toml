[project]
name = "ai-slack-bot"
version = "0.1.0"
description = "Slack bot backed by OpenAI-compatible LLMs (OpenAI, DeepSeek, ...)"
requires-python = ">=3.12"
dependencies = [
    "slack-bolt>=1.21",
    "aiohttp>=3.10",
    "openai>=1.50",
    "pydantic-settings>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "watchfiles>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

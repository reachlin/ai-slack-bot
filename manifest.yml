# Create the app at https://api.slack.com/apps -> "From an app manifest"
display_information:
  name: AI Bot
features:
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: AI Bot
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - groups:history
      - im:history
      - im:read
      - im:write
      - reactions:write
      # Reading an uploaded schwab_token.json for overseer_refresh_token.
      - files:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  # Required for the overseer approval buttons. With Socket Mode there is no
  # request URL to configure; the toggle just has to be on.
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
